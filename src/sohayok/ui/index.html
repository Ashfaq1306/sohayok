<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sohayok</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6573; --line: #e3e6eb;
    --accent: #0f766e; --accent-soft: #e6f4f2; --user: #eef2ff; --user-text: #1e2a5a;
    --warn: #b45309; --warn-soft: #fff7ed; --danger: #b91c1c; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --muted: #9aa3b2; --line: #272c36;
      --accent: #2dd4bf; --accent-soft: #11302d; --user: #1c2340; --user-text: #d6dcff;
      --warn: #fbbf24; --warn-soft: #2a2012; --danger: #f87171; --ok: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --muted: #9aa3b2; --line: #272c36;
    --accent: #2dd4bf; --accent-soft: #11302d; --user: #1c2340; --user-text: #d6dcff;
    --warn: #fbbf24; --warn-soft: #2a2012; --danger: #f87171; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", "Nirmala UI", "Noto Sans Bengali", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12px; }
  .pill {
    margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .pill.listening { background: #fee2e2; color: #b91c1c; }
  .pill.thinking, .pill.acting, .pill.transcribing { background: var(--warn-soft); color: var(--warn); }
  main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 14px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tool {
    align-self: flex-start; font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--muted); border-left: 2px solid var(--line); padding: 2px 8px; max-width: 95%;
    white-space: pre-wrap; word-break: break-word;
  }
  .tool.err { color: var(--danger); border-color: var(--danger); }
  .error { align-self: center; color: var(--danger); font-size: 13px; }
  .confirm {
    border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 10px 12px;
    display: none; margin: 0 16px 10px;
  }
  .confirm.show { display: block; }
  .confirm p { margin: 0 0 8px; }
  .confirm button { margin-right: 8px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .mic {
    width: 52px; height: 52px; flex: none; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: white; display: grid; place-items: center;
    box-shadow: 0 0 0 0 rgba(239,68,68,.5); transition: background .15s;
  }
  .mic.on { background: #dc2626; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.45);} 100% { box-shadow: 0 0 0 14px rgba(220,38,38,0);} }
  .mic svg { width: 24px; height: 24px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  button.btn {
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit; cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: white; border-color: transparent; }
  button.btn.no { color: var(--danger); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .empty { color: var(--muted); text-align: center; margin: auto; max-width: 320px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>সহায়ক · Sohayok</h1>
    <div class="sub" id="backend">connecting…</div>
  </div>
  <span class="pill" id="state">idle</span>
</header>
<main id="log">
  <div class="empty" id="empty">“Hey Jarvis” বলুন, মাইক চাপুন, বা <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Space</kbd> দিয়ে বলুন।<br>
    Say “Hey Jarvis”, press the mic, or <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Space</kbd>, then speak Bangla or English.</div>
</main>
<div class="confirm" id="confirm" role="alertdialog" aria-live="assertive">
  <p id="confirm-q"></p>
  <button class="btn primary" id="yes">হ্যাঁ · Yes</button>
  <button class="btn no" id="no">না · No</button>
</div>
<footer>
  <div class="row">
    <button class="mic" id="mic" title="Talk (Ctrl+Alt+Space)" aria-label="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>
    </button>
    <input type="text" id="text" placeholder="লিখুন বা বলুন… / Type or speak…" autocomplete="off">
    <button class="btn" id="stop" title="Stop speaking">■</button>
  </div>
  <div class="chips" id="chips"></div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const examples = [
  "ক্রোম খোলো", "ভলিউম পঞ্চাশ করো", "কয়টা বাজে?", "ইউটিউবে আইয়ুব বাচ্চুর গান চালাও",
  "open notepad and write hello", "what's the weather today?", "আমার গিটহাবে কী আছে?",
  "take a screenshot",
];
for (const text of examples) {
  const chip = document.createElement("button");
  chip.className = "chip"; chip.textContent = text;
  chip.onclick = () => send(text);
  $("chips").append(chip);
}
const STATES = {
  idle: "প্রস্তুত · ready", listening: "শুনছি · listening", transcribing: "বুঝছি · transcribing",
  thinking: "ভাবছি · thinking", acting: "করছি · acting", speaking: "বলছি · speaking",
};

function add(cls, text, meta) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; el.append(m); }
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setState(state) {
  const pill = $("state");
  pill.textContent = STATES[state] || state;
  pill.className = "pill " + state;
  $("mic").classList.toggle("on", state === "listening");
  if (state !== "listening") $("mic").style.boxShadow = "";
}

const seen = new Set();
function handle(ev) {
  const key = ev.type + ev.time;
  if (ev.time && seen.has(key)) return;
  if (ev.time) seen.add(key);
  switch (ev.type) {
    case "state": setState(ev.state); break;
    case "heard": add("msg user", ev.text, (ev.language === "bn" ? "বাংলা" : "English") + (ev.source === "voice" ? " · 🎙" : "")); break;
    case "transcript": if (!ev.text) add("error", "কিছু শোনা যায়নি · nothing heard"); break;
    case "reply": add("msg bot", ev.text); break;
    case "partial": add("msg bot", ev.text, "…"); break;
    case "tool": add("tool" + (String(ev.result).startsWith("error") ? " err" : ""),
                     `${ev.name}(${JSON.stringify(ev.args)}) → ${ev.result}`); break;
    case "route": if (ev.seconds !== undefined) add("tool", `${ev.fast ? "fast path" : "model"} · ${ev.steps ?? 1} step(s) · ${ev.seconds}s`); break;
    case "confirm": $("confirm-q").textContent = ev.prompt; $("confirm").classList.add("show"); break;
    case "confirm_done": $("confirm").classList.remove("show"); break;
    case "error": add("error", ev.message); break;
    case "level": if ($("mic").classList.contains("on"))
      $("mic").style.boxShadow = `0 0 0 ${Math.min(16, 2 + ev.value * 400).toFixed(1)}px rgba(220,38,38,.35)`;
      break;
    case "ready": info.stt = ev.stt; showInfo(); break;
  }
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return res.json();
}
function send(text) { text = text.trim(); if (text) post("/api/command", { text }); }

$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { send(e.target.value); e.target.value = ""; }
});
$("mic").onclick = () => post("/api/listen");
$("stop").onclick = () => post("/api/stop");
$("yes").onclick = () => post("/api/confirm", { answer: true });
$("no").onclick = () => post("/api/confirm", { answer: false });

const info = {};
function showInfo() {
  $("backend").textContent = [info.backend, info.model, info.stt, info.wake].filter(Boolean).join(" · ");
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "hello") {
      Object.assign(info, { backend: ev.backend, model: ev.model, stt: ev.stt, wake: ev.wake });
      showInfo();
      for (const old of ev.history || []) handle(old);
      setState(ev.state);
    } else handle(ev);
  };
  ws.onclose = () => { $("backend").textContent = "reconnecting…"; setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
